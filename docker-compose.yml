services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    container_name: gocaro-frontend
    restart: always
    networks:
      - gocaro_net

# Xin gia nhập vào mạng lưới do Backend tạo ra
networks:
  gocaro_net:
    external: true
