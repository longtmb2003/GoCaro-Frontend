server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    sendfile on;
    etag on;

    # Unknown URLs must be real HTTP 404 responses, not a 200 response carrying
    # the SPA shell. Search engines otherwise index typo URLs as valid pages.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Some crawlers still probe the conventional path even when a PNG favicon
    # is explicitly linked in index.html.
    location = /favicon.ico {
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
        try_files /favicon-48.png =404;
    }

    # Vite hashed assets — filename changes on every build, so these
    # are safe to cache indefinitely.  If a deploy ships new JS, the
    # new index.html will reference a new hash and browsers fetch it.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public images, fonts, and audio are stable between releases but do not
    # have hashed filenames.  A shorter cache keeps repeat visits fast while
    # still allowing updates to propagate promptly.
    location ~* \.(?:avif|gif|ico|jpe?g|mp3|ogg|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for all routes so Vue Router
    # (createWebHistory) works on deep links and page refreshes.
    #
    # index.html MUST NOT be cached.  After a deploy the old cached
    # index.html would reference JS bundles that no longer exist,
    # producing a white screen.
    # Serve the SPA shell only for routes Vue Router actually owns. Dynamic
    # routes accept exactly one non-empty path segment.
    location ~ ^/(?:login|register|game|leaderboard|shop|history|collection|achievements|tournaments)/?$ {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    location ~ ^/(?:tournaments|replay|share|join)/[^/]+/?$ {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
