server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    sendfile on;
    etag on;

    # Vite hashed assets — filename changes on every build, so these
    # are safe to cache indefinitely.  If a deploy ships new JS, the
    # new index.html will reference a new hash and browsers fetch it.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public images, fonts, and audio are stable between releases but do not
    # have hashed filenames.  A shorter cache keeps repeat visits fast while
    # still allowing updates to propagate promptly.
    location ~* \.(?:avif|gif|ico|jpe?g|mp3|ogg|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for all routes so Vue Router
    # (createWebHistory) works on deep links and page refreshes.
    #
    # index.html MUST NOT be cached.  After a deploy the old cached
    # index.html would reference JS bundles that no longer exist,
    # producing a white screen.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
